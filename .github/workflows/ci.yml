name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # SDK 10 builds the multi-targeted Core.Idempotency (net8.0/net9.0/net10.0);
          # the 8.0 and 9.0 runtimes are required to run the net8.0/net9.0 test hosts.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore solution
        run: dotnet restore CoreSystem.Idempotency.sln

      - name: Build solution
        run: dotnet build CoreSystem.Idempotency.sln --configuration Release --no-restore

      - name: Check formatting
        run: dotnet format CoreSystem.Idempotency.sln --verify-no-changes --no-restore

      - name: Test solution
        run: dotnet test --solution CoreSystem.Idempotency.sln --configuration Release --no-build

      - name: Audit vulnerable packages
        continue-on-error: true
        run: dotnet list CoreSystem.Idempotency.sln package --vulnerable --include-transitive
