name: Publish NuGet Package

on:
  push:
    tags:
      - '*/v*'

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract info
        run: |
          # Extract project name (before the '/')
          PROJECT_NAME=$(echo "$GITHUB_REF_NAME" | cut -d'/' -f1)
          # Extract version (after the '/') and remove the 'v' prefix
          VERSION=$(echo "$GITHUB_REF_NAME" | cut -d'/' -f2 | sed 's/^v//')

          echo "PROJECT=$PROJECT_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Resolve publish project and its tests
        run: |
          PROJECT_PATH="src/$PROJECT/$PROJECT.csproj"

          if [ ! -f "$PROJECT_PATH" ]; then
            echo "Error: Package project '$PROJECT_PATH' does not exist."
            exit 1
          fi

          case "$PROJECT" in
            Core.Idempotency)
              TEST_PROJECTS="tests/Core.Idempotency.UnitTests/Core.Idempotency.UnitTests.csproj"
              ;;
            Core.Idempotency.Redis)
              TEST_PROJECTS="tests/Core.Idempotency.Redis.UnitTests/Core.Idempotency.Redis.UnitTests.csproj tests/Core.Idempotency.Redis.IntegrationTests/Core.Idempotency.Redis.IntegrationTests.csproj"
              ;;
            Core.Idempotency.PostgreSql)
              TEST_PROJECTS="tests/Core.Idempotency.PostgreSql.UnitTests/Core.Idempotency.PostgreSql.UnitTests.csproj tests/Core.Idempotency.PostgreSql.IntegrationTests/Core.Idempotency.PostgreSql.IntegrationTests.csproj"
              ;;
            *)
              echo "Error: No test-project mapping exists for '$PROJECT'."
              echo "Add a case entry in .github/workflows/publish.yml before releasing it."
              exit 1
              ;;
          esac

          echo "PROJECT_PATH=$PROJECT_PATH" >> $GITHUB_ENV
          echo "TEST_PROJECTS=$TEST_PROJECTS" >> $GITHUB_ENV

          # The PackageId is not always the project folder name, so read it from
          # the csproj instead of assuming. The push step below pushes this exact
          # file rather than a glob over ./nupkgs.
          PACKAGE_ID=$(grep -oPm1 '(?<=<PackageId>)[^<]+' "$PROJECT_PATH")
          if [ -z "$PACKAGE_ID" ]; then
            echo "Error: could not read <PackageId> from '$PROJECT_PATH'."
            exit 1
          fi

          echo "PACKAGE_ID=$PACKAGE_ID" >> $GITHUB_ENV

      - name: Restore package project and its tests
        run: |
          dotnet restore "$PROJECT_PATH" --locked-mode

          for test_project in $TEST_PROJECTS; do
            dotnet restore "$test_project" --locked-mode
          done

      - name: Build package project
        run: |
          dotnet build "$PROJECT_PATH" \
            --configuration Release \
            --no-restore \
            /p:Version=$VERSION \
            /p:AssemblyVersion=$VERSION \
            /p:FileVersion=$VERSION \
            /p:InformationalVersion=$VERSION

      - name: Test package project
        run: |
          for test_project in $TEST_PROJECTS; do
            dotnet test "$test_project" \
              --configuration Release \
              --no-restore \
              /p:Version=$VERSION \
              /p:AssemblyVersion=$VERSION \
              /p:FileVersion=$VERSION \
              /p:InformationalVersion=$VERSION
          done

      - name: Pack package
        run: |
          rm -rf ./nupkgs
          dotnet pack "$PROJECT_PATH" \
            --configuration Release \
            /p:Version=$VERSION \
            /p:AssemblyVersion=$VERSION \
            /p:FileVersion=$VERSION \
            /p:InformationalVersion=$VERSION \
            --no-build \
            --no-restore \
            --output ./nupkgs

          # Fail here if the expected package is missing, or if anything else
          # landed in the folder. Pushing a glob would otherwise publish
          # whatever happened to be present.
          EXPECTED="./nupkgs/$PACKAGE_ID.$VERSION.nupkg"
          if [ ! -f "$EXPECTED" ]; then
            echo "Error: expected '$EXPECTED' but it was not produced."
            ls -la ./nupkgs || true
            exit 1
          fi

          COUNT=$(find ./nupkgs -maxdepth 1 -name '*.nupkg' | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "Error: expected exactly 1 nupkg in ./nupkgs, found $COUNT."
            ls -la ./nupkgs || true
            exit 1
          fi

          echo "PACKAGE_PATH=$EXPECTED" >> $GITHUB_ENV

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # No --skip-duplicate. It downgrades a 409 Conflict to a warning, so a
          # re-run of an already published version would report success while
          # publishing nothing. Published versions are immutable, so a 409 here
          # means the version is already live and this run is redundant: fail
          # loudly instead of pretending to publish.
          dotnet nuget push "$PACKAGE_PATH" \
            --api-key "$NUGET_API_KEY" \
            --source "https://api.nuget.org/v3/index.json"

      - name: Configure GitHub Packages
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget add source \
            --username "$GITHUB_USERNAME" \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json"

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "$PACKAGE_PATH" \
            --source github \
            --api-key "$GITHUB_TOKEN"