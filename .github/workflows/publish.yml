name: Publish NuGet Package

on:
  push:
    tags:
      - '*/v*'

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Extract info
        run: |
          # Tag format is <project folder>/v<version>, e.g. Core.Idempotency/v2.0.1
          PROJECT_NAME=$(echo "$GITHUB_REF_NAME" | cut -d'/' -f1)
          VERSION=$(echo "$GITHUB_REF_NAME" | cut -d'/' -f2 | sed 's/^v//')

          if [ -z "$PROJECT_NAME" ] || [ -z "$VERSION" ]; then
            echo "Error: expected a tag of the form <project>/v<version>, got '$GITHUB_REF_NAME'."
            exit 1
          fi

          echo "PROJECT=$PROJECT_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Resolve publish project and its tests
        run: |
          PROJECT_PATH="src/$PROJECT/$PROJECT.csproj"

          if [ ! -f "$PROJECT_PATH" ]; then
            echo "Error: Package project '$PROJECT_PATH' does not exist."
            exit 1
          fi

          # Every package that can be released needs an entry here. A package that
          # depends on another (the providers depend on Core.Idempotency) must be
          # tagged only after its dependency is already on the feed.
          case "$PROJECT" in
            Core.Idempotency)
              TEST_PROJECTS="tests/Core.Idempotency.UnitTests/Core.Idempotency.UnitTests.csproj"
              ;;
            Core.Idempotency.Redis)
              TEST_PROJECTS="tests/Core.Idempotency.Redis.UnitTests/Core.Idempotency.Redis.UnitTests.csproj tests/Core.Idempotency.Redis.IntegrationTests/Core.Idempotency.Redis.IntegrationTests.csproj"
              ;;
            Core.Idempotency.PostgreSql)
              TEST_PROJECTS="tests/Core.Idempotency.PostgreSql.UnitTests/Core.Idempotency.PostgreSql.UnitTests.csproj tests/Core.Idempotency.PostgreSql.IntegrationTests/Core.Idempotency.PostgreSql.IntegrationTests.csproj"
              ;;
            *)
              echo "Error: No test-project mapping exists for '$PROJECT'."
              echo "Add a case entry in .github/workflows/publish.yml before releasing it."
              exit 1
              ;;
          esac

          echo "PROJECT_PATH=$PROJECT_PATH" >> $GITHUB_ENV
          echo "TEST_PROJECTS=$TEST_PROJECTS" >> $GITHUB_ENV

      - name: Restore package project and its tests
        run: |
          dotnet restore "$PROJECT_PATH" --locked-mode

          for test_project in $TEST_PROJECTS; do
            dotnet restore "$test_project" --locked-mode
          done

      - name: Build package project
        run: |
          # Version is overridden on the command line, so all four version properties
          # must be passed. Overriding only /p:Version would leave AssemblyVersion,
          # FileVersion and InformationalVersion at the value hard-coded in the
          # csproj, shipping a package whose assembly metadata contradicts its nuspec.
          dotnet build "$PROJECT_PATH" \
            --configuration Release \
            --no-restore \
            /p:Version=$VERSION \
            /p:AssemblyVersion=$VERSION \
            /p:FileVersion=$VERSION \
            /p:InformationalVersion=$VERSION

      - name: Verify version metadata
        run: |
          DLL=$(find src/$PROJECT/bin/Release -name "$PROJECT.dll" | head -n 1)

          if [ -z "$DLL" ]; then
            echo "Error: expected an assembly under src/$PROJECT/bin/Release, found none."
            exit 1
          fi

          ACTUAL=$(dotnet msbuild "$PROJECT_PATH" -getProperty:AssemblyVersion -p:Version=$VERSION -p:AssemblyVersion=$VERSION 2>/dev/null | tail -n 1 | tr -d '"')

          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "Error: AssemblyVersion is '$ACTUAL' but the tag requests '$VERSION'."
            echo "The four version properties must agree before tagging."
            exit 1
          fi

          echo "Version metadata consistent: $VERSION"

      - name: Test package project
        run: |
          for test_project in $TEST_PROJECTS; do
            dotnet test "$test_project" \
              --configuration Release \
              --no-restore \
              /p:Version=$VERSION \
              /p:AssemblyVersion=$VERSION \
              /p:FileVersion=$VERSION \
              /p:InformationalVersion=$VERSION
          done

      - name: Pack package
        run: |
          dotnet pack "$PROJECT_PATH" \
            --configuration Release \
            /p:Version=$VERSION \
            /p:AssemblyVersion=$VERSION \
            /p:FileVersion=$VERSION \
            /p:InformationalVersion=$VERSION \
            --no-build \
            --no-restore \
            --output ./nupkgs

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Configure GitHub Packages
        run: |
          dotnet nuget add source \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --source github \
            --skip-duplicate